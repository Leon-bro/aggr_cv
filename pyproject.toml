[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aggcv"
version = "0.4.0"
description = "GridSearchCV з правилами агрегування результатів внутрішніх розбиттів"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yevhenii Verbenko"},
]
keywords = ["scikit-learn", "hyperparameter-tuning", "cross-validation",
            "nested-cross-validation", "model-selection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.8,<1.9",
    "pandas",
]

[project.urls]
Repository = "https://github.com/Leon-bro/aggr_cv"
Issues = "https://github.com/Leon-bro/aggr_cv/issues"

[project.optional-dependencies]
test = ["pytest", "joblib"]

[tool.setuptools]
packages = ["aggcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
